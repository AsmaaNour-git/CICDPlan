steps:
  # Install the exact dependency versions from package-lock.json
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['ci']

  # Run the Apigee proxy lint checks
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['run', 'lint:apigee']

  # Package the Apigee proxy
  - name: 'maven:3.9-eclipse-temurin-17'
    entrypoint: 'mvn'
    args:
      - '-f'
      - 'src/main/apigee/apiproxies/hello-name/pom.xml'
      - 'clean'
      - 'package'

artifacts:
  objects:
    location: 'gs://gold-optics-510908-b0_cloudbuild/apigee-artifacts/'
    paths:
      - 'src/main/apigee/apiproxies/hello-name/target/hello-name-1.0.0.zip'
