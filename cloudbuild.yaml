substitutions:
  _APIGEE_ENV: 'dev'

steps:
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:22'
    entrypoint: 'npm'
    args: ['run', 'lint:apigee']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args: ['-c', 'gcloud auth print-access-token > /workspace/token.txt']

  - name: 'maven:3.9-eclipse-temurin-17'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mvn -f src/main/apigee/apiproxies/hello-name/pom.xml clean install \
          -Pgoogleapi \
          -Dorg=$PROJECT_ID \
          -Denv=${_APIGEE_ENV} \
          -Dbearer=$$(cat /workspace/token.txt)

artifacts:
  objects:
    location: 'gs://gold-optics-510908-b0_cloudbuild/apigee-artifacts/'
    paths:
      - 'src/main/apigee/apiproxies/hello-name/target/hello-name-1.0.0.zip'